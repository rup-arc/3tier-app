name: Deploy Static Website to S3 and CloudFront

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Remove these Node steps if your project is plain HTML/CSS/JS
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: website-build
          path: dist

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  notify-success:
    needs: deploy
    if: ${{ always() && needs.deploy.result == 'success' }}

    uses: ./.github/workflows/reusable-teams-notification-workflow.yml

    with:
      payload: |
        {
          "@type": "MessageCard",
          "@context": "https://schema.org/extensions",
          "themeColor": "00FF00",
          "summary": "Deployment Success",
          "sections": [
            {
              "activityTitle": "✅ S3 + CloudFront Deployment Successful",
              "facts": [
                {
                  "name": "Repository",
                  "value": "${{ github.repository }}"
                },
                {
                  "name": "Branch",
                  "value": "${{ github.ref_name }}"
                },
                {
                  "name": "Environment",
                  "value": "Production"
                },
                {
                  "name": "Triggered By",
                  "value": "${{ github.actor }}"
                },
                {
                  "name": "Commit",
                  "value": "${{ github.sha }}"
                }
              ],
              "markdown": true
            },
            {
              "activityTitle": "Deployment Target",
              "text": "AWS S3 + CloudFront",
              "markdown": true
            }
          ]
        }

    secrets:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

  notify-failure:
    needs: deploy
    if: ${{ always() && needs.deploy.result == 'failure' }}

    uses: ./.github/workflows/reusable-teams-notification-workflow.yml

    with:
      payload: |
        {
          "@type": "MessageCard",
          "@context": "https://schema.org/extensions",
          "themeColor": "FF0000",
          "summary": "Deployment Failed",
          "title": "❌ Deployment Failed",
          "sections": [
            {
              "activityTitle": "S3 + CloudFront Deployment Failed",
              "facts": [
                {
                  "name": "Repository",
                  "value": "${{ github.repository }}"
                },
                {
                  "name": "Branch",
                  "value": "${{ github.ref_name }}"
                },
                {
                  "name": "Triggered By",
                  "value": "${{ github.actor }}"
                },
                {
                  "name": "Commit",
                  "value": "${{ github.sha }}"
                }
              ],
              "markdown": true
            },
            {
              "activityTitle": "Workflow Run",
              "text": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "markdown": true
            }
          ]
        }

    secrets:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
