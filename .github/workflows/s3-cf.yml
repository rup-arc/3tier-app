name: Deploy Frontend to S3 and CloudFront

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync build/ s3://${{ secrets.S3_BUCKET }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

  notify-success:
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}

    uses: ./.github/workflows/reusable-teams-notification-workflow.yml

    with:
      payload: |
        {
          "@type": "MessageCard",
          "@context": "https://schema.org/extensions",
          "themeColor": "00FF00",
          "summary": "Deployment Success",
          "sections": [
            {
              "activityTitle": "✅ Deployment Successful",
              "facts": [
                { "name": "Repository", "value": "${{ github.repository }}" },
                { "name": "Branch", "value": "${{ github.ref_name }}" },
                { "name": "Environment", "value": "Production" },
                { "name": "Triggered By", "value": "${{ github.actor }}" },
                { "name": "Commit", "value": "${{ github.sha }}" }
              ],
              "markdown": true
            },
            {
              "activityTitle": "Application URL",
              "text": "${{ vars.CLOUDFRONT_URL }}",
              "markdown": true
            },
            {
              "activityTitle": "Workflow Run",
              "text": "[Open Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
              "markdown": true
            }
          ]
        }

    secrets:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

  notify-failure:
    needs: deploy
    if: ${{ needs.deploy.result == 'failure' }}

    uses: ./.github/workflows/reusable-teams-notification-workflow.yml

    with:
      payload: |
        {
          "@type": "MessageCard",
          "@context": "https://schema.org/extensions",
          "themeColor": "FF0000",
          "summary": "Deployment Failed",
          "title": "❌ Deployment Failed",
          "sections": [
            {
              "activityTitle": "Deployment Failed",
              "facts": [
                { "name": "Repository", "value": "${{ github.repository }}" },
                { "name": "Branch", "value": "${{ github.ref_name }}" },
                { "name": "Environment", "value": "Production" },
                { "name": "Triggered By", "value": "${{ github.actor }}" },
                { "name": "Commit", "value": "${{ github.sha }}" }
              ],
              "markdown": true
            },
            {
              "activityTitle": "Workflow Run",
              "text": "[Open Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
              "markdown": true
            }
          ]
        }

    secrets:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
