name: 3Tier App CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - "frontend/**"
      - "k8s/**"
      - "Dockerfile*"
      - ".github/workflows/ecr-deploy.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPO_BACKEND: backend
  ECR_REPO_FRONTEND: frontend
  CLUSTER_NAME: myeks
  NAMESPACE: default

jobs:

# =========================
# 1. SECURITY SCAN (GITLEAKS)
# =========================
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

# =========================
# 2. BUILD & PUSH BACKEND
# =========================
  build-backend:
    needs: gitleaks
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::585853585762:role/github-actions-deploy-role-3-tier
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate Image Tag
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build & Push Backend Image
        run: |
          IMAGE=${{ env.ECR_REPO_BACKEND }}:${{ steps.tag.outputs.tag }}
          docker build -t $IMAGE ./backend
          docker tag $IMAGE ${{ steps.login-ecr.outputs.registry }}/$IMAGE
          docker push ${{ steps.login-ecr.outputs.registry }}/$IMAGE

# =========================
# 3. BUILD & PUSH FRONTEND
# =========================
  build-frontend:
    needs: gitleaks
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::585853585762:role/github-actions-deploy-role-3-tier
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate Image Tag
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build & Push Frontend Image
        run: |
          IMAGE=${{ env.ECR_REPO_FRONTEND }}:${{ steps.tag.outputs.tag }}
          docker build -t $IMAGE ./frontend
          docker tag $IMAGE ${{ steps.login-ecr.outputs.registry }}/$IMAGE
          docker push ${{ steps.login-ecr.outputs.registry }}/$IMAGE

# =========================
# 4. DEPLOY TO EKS
# =========================
  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::585853585762:role/github-actions-deploy-role-3-tier
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      # SMART IMAGE UPDATE (NO MANUAL YAML EDIT)
      - name: Update backend image
        run: |
          kubectl set image deployment/backend-deployment \
          backend=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_BACKEND }}:${{ needs.build-backend.outputs.image_tag }} \
          -n ${{ env.NAMESPACE }}

      - name: Update frontend image
        run: |
          kubectl set image deployment/frontend-deployment \
          frontend=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_FRONTEND }}:${{ needs.build-frontend.outputs.image_tag }} \
          -n ${{ env.NAMESPACE }}

      - name: Rollout status
        run: |
          kubectl rollout status deployment/backend-deployment -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/frontend-deployment -n ${{ env.NAMESPACE }}

# =========================
# 5. SUCCESS NOTIFICATION (SNS)
# =========================
  notify-success:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::585853585762:role/github-actions-deploy-role-3-tier
          aws-region: ap-south-1

      - name: Send SNS Success
        run: |
          aws sns publish \
            --topic-arn "${{ secrets.SNS_TOPIC_ARN }}" \
            --subject "Deployment Successful" \
            --message "Repo: ${{ github.repository }} | Commit: ${{ github.sha }}"

# =========================
# 6. FAILURE NOTIFICATION (SNS)
# =========================
  notify-failure:
    needs: [gitleaks, deploy]
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::585853585762:role/github-actions-deploy-role-3-tier
          aws-region: ap-south-1

      - name: Send SNS Failure
        run: |
          aws sns publish \
            --topic-arn "${{ secrets.SNS_TOPIC_ARN }}" \
            --subject "Deployment Failed" \
            --message "Repo: ${{ github.repository }} | Commit: ${{ github.sha }}"
