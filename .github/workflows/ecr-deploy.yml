name:  3Tier CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'k8s/**'
      - '.github/workflows/ecr-deploy.yml'

permissions:
  id-token: write
  contents: read


jobs:


  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  trivy:
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 0



  detect-changes:
    runs-on: ubuntu-latest
    needs: trivy
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changes
        id: filter
        run: |
          echo "backend=false" >> $GITHUB_OUTPUT
          echo "frontend=false" >> $GITHUB_OUTPUT

          if git diff HEAD~1 HEAD --name-only | grep -q backend; then
            echo "backend=true" >> $GITHUB_OUTPUT
          fi

          if git diff HEAD~1 HEAD --name-only | grep -q frontend; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          fi



  build-backend:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE_TAG=v1-${GITHUB_SHA::7}
          BACKEND_IMAGE="$ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/3tier-app/backend:$IMAGE_TAG"

          docker build -t $BACKEND_IMAGE backend/
          docker push $BACKEND_IMAGE

          echo "BACKEND_IMAGE=$BACKEND_IMAGE" >> $GITHUB_ENV

      - name: Smart Update Backend YAML
        run: |
          sed -i "s|image: .*backend.*|image: $BACKEND_IMAGE|g" k8s/backend-deployment.yaml

      - name: Upload Backend YAML
        uses: actions/upload-artifact@v4
        with:
          name: backend-yaml
          path: k8s/backend-deployment.yaml



  build-frontend:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Frontend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE_TAG=v1-${GITHUB_SHA::7}
          FRONTEND_IMAGE="$ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/3tier-app/frontend:$IMAGE_TAG"

          docker build -t $FRONTEND_IMAGE frontend/
          docker push $FRONTEND_IMAGE

          echo "FRONTEND_IMAGE=$FRONTEND_IMAGE" >> $GITHUB_ENV

      - name: Smart Update Frontend YAML
        run: |
          sed -i "s|image: .*frontend.*|image: $FRONTEND_IMAGE|g" k8s/frontend-deployment.yaml

      - name: Upload Frontend YAML
        uses: actions/upload-artifact@v4
        with:
          name: frontend-yaml
          path: k8s/frontend-deployment.yaml



  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name myeks --region ap-south-1

      - name: Deploy Backend
        run: |
          kubectl apply -f k8s/backend-deployment.yaml || true

      - name: Deploy Frontend
        run: |
          kubectl apply -f k8s/frontend-deployment.yaml || true

      - name: Rollout Status
        run: |
          kubectl rollout status deployment/backend-deployment -n default --timeout=5m || true
          kubectl rollout status deployment/frontend-deployment -n default --timeout=5m || true

      - name: Verify
        run: |
          kubectl get pods -n default
          kubectl get svc -n default
