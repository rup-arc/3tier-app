name: ECR Build & Deploy to EKS

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - "frontend/**"
      - "k8s/**"
      - "Dockerfile**"
      - ".github/workflows/ecr-deploy.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  CLUSTER_NAME: myeks
  NAMESPACE: default
  ECR_REGISTRY: 585853585762.dkr.ecr.ap-south-1.amazonaws.com

jobs:

# =========================
# GITLEAKS
# =========================
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

# =========================
# BUILD + PUSH + TAG BACKEND
# =========================
  backend:
    needs: gitleaks
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::585853585762:role/github-actions-deploy-role-3-tier
          aws-region: ap-south-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login

      - name: Generate tag
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build & Push Backend
        run: |
          docker build -t backend:${{ steps.tag.outputs.tag }} ./backend
          docker tag backend:${{ steps.tag.outputs.tag }} $ECR_REGISTRY/backend:${{ steps.tag.outputs.tag }}
          docker push $ECR_REGISTRY/backend:${{ steps.tag.outputs.tag }}

# =========================
# BUILD + PUSH FRONTEND
# =========================
  frontend:
    needs: gitleaks
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::585853585762:role/github-actions-deploy-role-3-tier
          aws-region: ap-south-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login

      - name: Generate tag
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build & Push Frontend
        run: |
          docker build -t frontend:${{ steps.tag.outputs.tag }} ./frontend
          docker tag frontend:${{ steps.tag.outputs.tag }} $ECR_REGISTRY/frontend:${{ steps.tag.outputs.tag }}
          docker push $ECR_REGISTRY/frontend:${{ steps.tag.outputs.tag }}

# =========================
# DEPLOY TO EKS (FIXED AUTH ISSUE)
# =========================
  deploy:
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::585853585762:role/github-actions-deploy-role-3-tier
          aws-region: ap-south-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name $CLUSTER_NAME --region $AWS_REGION

      - name: Test cluster access
        run: |
          aws sts get-caller-identity
          kubectl get nodes

      # 🔥 FIX: correct image update (NO YAML EDIT)
      - name: Update backend image
        run: |
          kubectl set image deployment/backend-deployment \
          backend=$ECR_REGISTRY/backend:${{ needs.backend.outputs.image_tag }}

      - name: Update frontend image
        run: |
          kubectl set image deployment/frontend-deployment \
          frontend=$ECR_REGISTRY/frontend:${{ needs.frontend.outputs.image_tag }}

      - name: Rollout status
        run: |
          kubectl rollout status deployment/backend-deployment
          kubectl rollout status deployment/frontend-deployment

# =========================
# SNS SUCCESS
# =========================
  notify-success:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: AWS auth
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::585853585762:role/github-actions-deploy-role-3-tier
          aws-region: ap-south-1

      - name: SNS Success
        run: |
          aws sns publish \
            --topic-arn "${{ secrets.SNS_TOPIC_ARN }}" \
            --subject "Deploy Success" \
            --message "Commit: ${{ github.sha }}"

# =========================
# SNS FAILURE
# =========================
  notify-failure:
    needs: [backend, frontend, deploy]
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: AWS auth
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::585853585762:role/github-actions-deploy-role-3-tier
          aws-region: ap-south-1

      - name: SNS Failure
        run: |
          aws sns publish \
            --topic-arn "${{ secrets.SNS_TOPIC_ARN }}" \
            --subject "Deploy Failed"
            --message "Check GitHub Actions logs: ${{ github.server_url }}/${{ github.repository }}/actions"
