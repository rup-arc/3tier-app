name: ECR Build → Push → Deploy to EKS

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "k8s/**"
      - ".github/workflows/ecr-deploy.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPO_BACKEND: backend
  ECR_REPO_FRONTEND: frontend
  CLUSTER_NAME: myeks

jobs:
# ----------------------------
# 1. SECURITY SCAN
# ----------------------------
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: zricethezav/gitleaks-action@v2

      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          format: table
          exit-code: 1

# ----------------------------
# 2. BUILD & PUSH
# ----------------------------
  build:
    needs: security
    runs-on: ubuntu-latest
    outputs:
      backend_tag: ${{ steps.meta.outputs.backend_tag }}
      frontend_tag: ${{ steps.meta.outputs.frontend_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Generate IMAGE TAG
        id: meta
        run: |
          TAG=${GITHUB_SHA::7}
          echo "backend_tag=$TAG" >> $GITHUB_OUTPUT
          echo "frontend_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build & Push Backend
        run: |
          docker build -t backend:${{ steps.meta.outputs.backend_tag }} ./backend
          docker tag backend:${{ steps.meta.outputs.backend_tag }} ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/backend:${{ steps.meta.outputs.backend_tag }}
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/backend:${{ steps.meta.outputs.backend_tag }}

      - name: Build & Push Frontend
        run: |
          docker build -t frontend:${{ steps.meta.outputs.frontend_tag }} ./frontend
          docker tag frontend:${{ steps.meta.outputs.frontend_tag }} ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/frontend:${{ steps.meta.outputs.frontend_tag }}
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/frontend:${{ steps.meta.outputs.frontend_tag }}

# ----------------------------
# 3. DEPLOY TO EKS
# ----------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name $CLUSTER_NAME --region $AWS_REGION

      - name: Update Backend Image
        run: |
          sed -i "s|backend:.*|backend:${{ needs.build.outputs.backend_tag }}|g" k8s/backend-deployment.yaml

      - name: Update Frontend Image
        run: |
          sed -i "s|frontend:.*|frontend:${{ needs.build.outputs.frontend_tag }}|g" k8s/frontend-deployment.yaml

      - name: Apply Kubernetes
        run: |
          kubectl apply -f k8s/

      - name: Rollout Status
        run: |
          kubectl rollout status deployment/backend-deployment
          kubectl rollout status deployment/frontend-deployment

# ----------------------------
# 4. SNS NOTIFICATIONS
# ----------------------------
  notify-success:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: AWS Login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Send SNS Success
        run: |
          aws sns publish \
            --topic-arn "${{ secrets.SNS_TOPIC_ARN }}" \
            --subject "EKS Deploy Success" \
            --message "Deployment successful: ${{ github.sha }}"

  notify-failure:
    needs: [security, build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: AWS Login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Send SNS Failure
        run: |
          aws sns publish \
            --topic-arn "${{ secrets.SNS_TOPIC_ARN }}" \
            --subject "EKS Deploy Failed" \
            --message "Pipeline failed for commit: ${{ github.sha }}"
